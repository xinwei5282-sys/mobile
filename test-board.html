<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>营期看板测试</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #f5f5f5; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
    thead { background: #f9f9f9; }
    th, td { padding: 12px 8px; border: 1px solid #eee; }
    th { font-weight: 600; color: #333; font-size: 12px; }
    .period { color: #5dd4cc; font-weight: 600; }
    .stat { text-align: center; color: #5dd4cc; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const teamMembers = ref([]);

        const tableRows = computed(() => {
          const rows = [];
          teamMembers.value.forEach(m => {
            (m.periods || []).forEach(p => {
              rows.push({
                period: p.num,
                memberName: m.name,
                memberId: m.id,
                invited: p.invited,
                joined: p.joined,
                card: p.card,
                success: p.success
              });
            });
          });
          return rows.sort((a, b) => {
            if (a.period !== b.period) return b.period - a.period;
            return a.memberId - b.memberId;
          });
        });

        onMounted(() => {
          teamMembers.value = [
            {
              id: 1, name: '张三',
              periods: [
                { num: 113, invited: 5, joined: 3, card: 2, success: 1 },
                { num: 112, invited: 8, joined: 5, card: 3, success: 2 },
              ]
            },
            {
              id: 2, name: '李四',
              periods: [
                { num: 113, invited: 7, joined: 5, card: 3, success: 2 },
                { num: 112, invited: 6, joined: 4, card: 2, success: 1 },
              ]
            },
          ];
        });

        return { tableRows };
      },
      template: `
        <div>
          <h2>营期看板测试</h2>
          <p>行数: {{ tableRows.length }}</p>
          <table>
            <thead>
              <tr>
                <th>营期</th>
                <th>成员</th>
                <th>已邀请</th>
                <th>已入营</th>
                <th>已领卡</th>
                <th>推荐成功</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(row, idx) in tableRows" :key="idx">
                <td class="period">第{{ row.period }}期</td>
                <td>{{ row.memberName }}</td>
                <td class="stat">{{ row.invited }}</td>
                <td class="stat">{{ row.joined }}</td>
                <td class="stat">{{ row.card }}</td>
                <td class="stat">{{ row.success }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `
    }).mount('#app');
  </script>
</body>
</html>
