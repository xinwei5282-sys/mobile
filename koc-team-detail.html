<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请明细 - KOC 团队管理</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: #f4f5f7;
    }

    #app {
      width: 100%;
      min-height: 100vh;
    }

    .koc-team-detail-page {
      display: flex;
      flex-direction: column;
      width: 100vw;
      min-height: 100vh;
      background: #f4f5f7;
    }

    .page-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #eee;
      z-index: 10;
      display: flex;
      align-items: center;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 16px;
    }

    .btn-back {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .btn-back:active {
      opacity: 0.6;
    }

    .header-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0;
      flex: 1;
      text-align: center;
    }

    .header-spacer {
      width: 32px;
    }

    .page-content {
      flex: 1;
      overflow-y: auto;
      padding-top: 56px;
      padding-bottom: 20px;
    }

    .member-info-card {
      background: #fff;
      margin: 16px;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .info-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .member-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0 0 4px 0;
    }

    .member-tag {
      font-size: 12px;
      background: #f0f5ff;
      color: #0052ff;
      border-radius: 4px;
      padding: 2px 8px;
      display: inline-block;
      margin: 0;
    }

    .info-code {
      font-size: 12px;
      background: #f9fafb;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .code-label {
      color: #999;
    }

    .code-value {
      color: #0052ff;
      font-weight: 600;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .stats-section {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #fff;
      padding: 16px 12px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      color: #0052ff;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
    }

    .filter-section {
      padding: 0 16px 12px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .filter-tab {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .filter-tab.active {
      border-color: #0052ff;
      background: #f0f5ff;
      color: #0052ff;
    }

    .filter-tab:not(.active):active {
      background: #f4f5f7;
    }

    .invitation-list {
      padding: 0 16px;
    }

    .invitation-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 2px;
    }

    .user-status {
      font-size: 12px;
      color: #0052ff;
      margin-bottom: 2px;
    }

    .user-time {
      font-size: 12px;
      color: #999;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-text {
      font-size: 14px;
      color: #999;
      margin: 0;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f0f5ff;
      border-top-color: #0052ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-state p {
      font-size: 14px;
      color: #999;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const app = createApp({
      setup() {
        const distributorId = ref('1');

        const memberInfo = ref({
          distributorName: '',
          inviteCode: '',
          tag: '',
        });

        const stats = ref({
          totalInvite: 0,
          totalConvert: 0,
          tryCount: 0,
          chatCount: 0,
        });

        const filterStatus = ref('');
        const invitationList = ref([]);
        const loading = ref(false);

        const filterItems = [
          { label: '全部', value: '' },
          { label: '推荐成功', value: 'xq_paid' },
          { label: '已领卡', value: 'xq_tried' },
          { label: '已入营', value: 'room_entered' },
          { label: '未入营', value: 'room_not_enter' },
        ];

        // 存储所有下属数据
        const allMembers = {
          1: {
            distributorName: '张三',
            inviteCode: 'KOC_M_001234',
            tag: '微信群1',
            stats: { totalInvite: 28, totalConvert: 10, tryCount: 20, chatCount: 8 },
            invitations: [
              { id: 1, wxName: '李四', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user1', externalUserWorkAddTime: '2026-05-01 14:30:00', statusDesc: '推荐成功', status: 'xq_paid' },
              { id: 2, wxName: '王五', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user2', externalUserWorkAddTime: '2026-05-02 10:15:00', statusDesc: '已领卡', status: 'xq_tried' },
              { id: 3, wxName: '赵六', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user3', externalUserWorkAddTime: '2026-05-03 09:45:00', statusDesc: '已入营', status: 'room_entered' },
              { id: 4, wxName: '孙七', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user4', externalUserWorkAddTime: '2026-05-04 15:20:00', statusDesc: '未入营', status: 'room_not_enter' },
            ]
          },
          2: {
            distributorName: '李四',
            inviteCode: 'KOC_M_001235',
            tag: '朋友圈',
            stats: { totalInvite: 35, totalConvert: 15, tryCount: 25, chatCount: 12 },
            invitations: [
              { id: 5, wxName: '田八', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user5', externalUserWorkAddTime: '2026-05-05 11:00:00', statusDesc: '推荐成功', status: 'xq_paid' },
              { id: 6, wxName: '周九', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user6', externalUserWorkAddTime: '2026-05-06 13:30:00', statusDesc: '已领卡', status: 'xq_tried' },
              { id: 7, wxName: '吴十', wxAvatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=user7', externalUserWorkAddTime: '2026-05-07 09:15:00', statusDesc: '已入营', status: 'room_entered' },
            ]
          }
        };

        const loadInvitationList = async (isForce = false) => {
          if (loading.value) return;

          loading.value = true;
          try {
            if (isForce) {
              const memberId = distributorId.value;
              const memberData = allMembers[memberId];

              if (memberData) {
                memberInfo.value = {
                  distributorName: memberData.distributorName,
                  inviteCode: memberData.inviteCode,
                  tag: memberData.tag,
                };
                stats.value = memberData.stats;
                invitationList.value = memberData.invitations;
              }
            }
          } catch (error) {
            console.error('Failed to load invitations:', error);
            alert('加载失败，请重试');
          } finally {
            loading.value = false;
          }
        };

        const handleFilterChange = (status) => {
          filterStatus.value = status;
          loadInvitationList(true);
        };

        const goBack = () => {
          window.history.back();
        };

        const filteredStats = computed(() => {
          return stats.value;
        });

        const filteredInvitations = computed(() => {
          if (!filterStatus.value) {
            return invitationList.value;
          }
          return invitationList.value.filter(item => item.status === filterStatus.value);
        });

        onMounted(() => {
          // 从 URL 参数读取下属 ID
          const params = new URLSearchParams(window.location.search);
          const id = params.get('id');
          if (id) {
            distributorId.value = id;
          }
          loadInvitationList(true);
        });

        return {
          memberInfo,
          stats,
          filterStatus,
          invitationList: filteredInvitations,
          loading,
          filterItems,
          handleFilterChange,
          goBack,
          filteredStats
        };
      },
      template: `
        <div class="koc-team-detail-page">
          <div class="page-header">
            <div class="header-content">
              <button class="btn-back" @click="goBack">←</button>
              <h1 class="header-title">邀请明细</h1>
              <div class="header-spacer"></div>
            </div>
          </div>

          <div class="page-content">
            <div class="member-info-card">
              <div class="info-header">
                <div>
                  <h2 class="member-name">{{ memberInfo.distributorName }}</h2>
                  <p class="member-tag">{{ memberInfo.tag }}</p>
                </div>
              </div>
              <div class="info-code">
                <span class="code-label">邀请码：</span>
                <span class="code-value">{{ memberInfo.inviteCode }}</span>
              </div>
            </div>

            <div class="stats-section">
              <div class="stat-card">
                <div class="stat-value">{{ filteredStats.totalInvite }}</div>
                <div class="stat-label">邀请总数</div>
              </div>
              <div class="stat-card">
                <div class="stat-value">{{ filteredStats.totalConvert }}</div>
                <div class="stat-label">转化总数</div>
              </div>
              <div class="stat-card">
                <div class="stat-value">{{ filteredStats.tryCount }}</div>
                <div class="stat-label">已领卡</div>
              </div>
              <div class="stat-card">
                <div class="stat-value">{{ filteredStats.chatCount }}</div>
                <div class="stat-label">已入营</div>
              </div>
            </div>

            <div class="filter-section">
              <div class="filter-tabs">
                <button
                  v-for="item in filterItems"
                  :key="item.value"
                  class="filter-tab"
                  :class="{ active: filterStatus === item.value }"
                  @click="handleFilterChange(item.value)"
                >
                  {{ item.label }}
                </button>
              </div>
            </div>

            <div class="invitation-list">
              <div v-if="invitationList.length === 0 && !loading" class="empty-state">
                <div class="empty-icon">📭</div>
                <p class="empty-text">暂无邀请记录</p>
              </div>

              <div v-else>
                <div v-for="item in invitationList" :key="item.id" class="invitation-item">
                  <img :src="item.wxAvatar" :alt="item.wxName" class="user-avatar" />
                  <div class="user-info">
                    <div class="user-name">{{ item.wxName }}</div>
                    <div class="user-status">{{ item.statusDesc }}</div>
                    <div class="user-time">{{ item.externalUserWorkAddTime }}</div>
                  </div>
                </div>
              </div>

              <div v-if="loading" class="loading-state">
                <div class="spinner"></div>
                <p>加载中...</p>
              </div>
            </div>
          </div>
        </div>
      `
    });

    app.mount('#app');
  </script>
</body>
</html>
