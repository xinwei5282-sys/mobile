<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请记录 - 生财官网</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #d4f4f1 0%, #e8faf8 100%);
    }

    /* 顶部导航栏 */
    .top-navbar {
      background: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left, .nav-right {
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .nav-url {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 页面标题栏 */
    .title-bar {
      background: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-bar-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-bar-text {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    /* 页面内容 */
    .page-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* 统计区域 */
    .stats-section {
      background: #fff;
      padding: 20px 16px;
      display: flex;
      gap: 0;
    }

    .stat-col {
      flex: 1;
      text-align: center;
      padding: 0 12px;
    }

    .stat-col:first-child {
      border-right: 1px solid #eee;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: #333;
    }

    .info-icon {
      width: 14px;
      height: 14px;
      border: 1px solid #ccc;
      border-radius: 50%;
      font-size: 10px;
      line-height: 12px;
      text-align: center;
      color: #999;
      cursor: pointer;
    }

    /* 按钮区域 */
    .action-section {
      background: rgba(212, 244, 241, 0.5);
      padding: 12px 16px;
      display: flex;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      background: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
      color: #5dd4cc;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .action-btn:active {
      background: #f5f5f5;
    }

    .action-icon {
      font-size: 14px;
    }

    .action-info-icon {
      width: 12px;
      height: 12px;
      border: 1px solid #5dd4cc;
      border-radius: 50%;
      font-size: 9px;
      line-height: 10px;
      text-align: center;
      color: #5dd4cc;
      margin-left: 2px;
    }

    /* Tab 和筛选区域 */
    .tabs-filter-wrapper {
      background: #fff;
    }

    .tabs-section {
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      display: flex;
    }

    .tab {
      background: none;
      border: none;
      padding: 14px 16px;
      cursor: pointer;
      color: #999;
      font-size: 14px;
      position: relative;
      transition: color 0.3s ease;
      font-weight: 500;
    }

    .tab.active {
      color: #333;
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 3px;
      background: #5dd4cc;
    }

    .filters-section {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-btn {
      background: #f5f5f5;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .filter-btn.active {
      background: #5dd4cc;
      color: #fff;
    }

    .filter-btn:active {
      opacity: 0.8;
    }

    /* 内容区域 */
    .content-area {
      flex: 1;
      background: #f5f5f5;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }

    .empty-text {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    /* 邮箱插图 */
    .mailbox-illustration {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      max-width: 120px;
      max-height: 120px;
    }

    /* 加载态 */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e8f5f4;
      border-top-color: #5dd4cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-state p {
      font-size: 14px;
      color: #999;
    }

    /* 用户列表项 */
    .invitation-item {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5dd4cc 0%, #4cc4bb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 2px;
    }

    .user-status {
      font-size: 12px;
      color: #5dd4cc;
      margin-bottom: 2px;
      font-weight: 500;
    }

    .user-time {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const app = createApp({
      setup() {
        const currentTab = ref('progress');
        const filterStatus = ref('');
        const invitationList = ref([]);
        const loading = ref(false);

        const invitationStats = ref({
          totalInvite: 0,
          totalConvert: 0,
        });

        const filterItems = [
          { label: '全部', value: '' },
          { label: '推荐成功', value: 'xq_paid' },
          { label: '已领卡', value: 'xq_tried' },
          { label: '已入营', value: 'room_entered' },
          { label: '未入营', value: 'room_not_enter' },
        ];

        const loadInvitations = () => {
          loading.value = true;
          setTimeout(() => {
            invitationStats.value = {
              totalInvite: 0,
              totalConvert: 0,
            };
            invitationList.value = [];
            loading.value = false;
          }, 500);
        };

        const filteredInvitations = computed(() => {
          if (!filterStatus.value) {
            return invitationList.value;
          }
          return invitationList.value.filter(item => item.status === filterStatus.value);
        });

        onMounted(() => {
          loadInvitations();
        });

        return {
          currentTab,
          filterStatus,
          invitationList: filteredInvitations,
          loading,
          invitationStats,
          filterItems,
        };
      },
      template: `
        <div id="app-container">
          <!-- 顶部导航栏 -->
          <div class="top-navbar">
            <div class="nav-left">
              <button class="nav-btn">×</button>
            </div>
            <div class="nav-center">
              <div class="nav-title">生财官网·会员体验卡</div>
              <div class="nav-url">scys.com</div>
            </div>
            <div class="nav-right">
              <button class="nav-btn">⋯</button>
            </div>
          </div>

          <!-- 页面标题栏 -->
          <div class="title-bar">
            <button class="title-bar-btn">‹</button>
            <div class="title-bar-text">体验营邀请记录</div>
          </div>

          <div class="page-wrapper">
            <!-- 统计区域 -->
            <div class="stats-section">
              <div class="stat-col">
                <div class="stat-label">
                  已邀请总人数
                  <span class="info-icon">ⓘ</span>
                </div>
                <div class="stat-value">{{ invitationStats.totalInvite }}</div>
              </div>
              <div class="stat-col">
                <div class="stat-label">
                  成功推荐总人数
                  <span class="info-icon">ⓘ</span>
                </div>
                <div class="stat-value">{{ invitationStats.totalConvert }}</div>
              </div>
            </div>

            <!-- 按钮区域 -->
            <div class="action-section">
              <button class="action-btn">
                <span class="action-icon">🔗</span>
                <span>生成邀请码</span>
                <span class="action-info-icon">ⓘ</span>
              </button>
              <button class="action-btn">
                <span class="action-icon">📊</span>
                <span>切换历史数据</span>
              </button>
            </div>

            <!-- Tab 和筛选区域 -->
            <div class="tabs-filter-wrapper">
              <div class="tabs-section">
                <button
                  class="tab"
                  :class="{ active: currentTab === 'progress' }"
                  @click="currentTab = 'progress'"
                >
                  邀请进度
                </button>
                <button
                  class="tab"
                  :class="{ active: currentTab === 'board' }"
                  @click="currentTab = 'board'"
                >
                  营期看板
                </button>
              </div>

              <div class="filters-section">
                <button
                  v-for="item in filterItems"
                  :key="item.value"
                  class="filter-btn"
                  :class="{ active: filterStatus === item.value }"
                  @click="filterStatus = item.value"
                >
                  {{ item.label }}
                </button>
              </div>
            </div>

            <!-- 内容区域 -->
            <div class="content-area">
              <div class="list-container">
                <!-- 邀请进度 -->
                <div v-if="currentTab === 'progress'">
                  <div v-if="invitationList.length === 0 && !loading" class="empty-state">
                    <div class="empty-icon">
                      <div class="mailbox-illustration">
                        <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
                          <!-- 邮箱主体 -->
                          <rect x="40" y="60" width="120" height="70" rx="8" fill="#a8ddd8" opacity="0.6"/>
                          <!-- 邮箱盖 -->
                          <path d="M 40 60 L 100 30 L 160 60" fill="#7eccc4" opacity="0.8"/>
                          <!-- 邮箱旗子 -->
                          <rect x="155" y="75" width="20" height="12" rx="2" fill="#7eccc4" opacity="0.7"/>
                          <line x1="175" y1="81" x2="190" y2="70" stroke="#5dd4cc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                          <!-- 装饰线 -->
                          <circle cx="120" cy="50" r="3" fill="#5dd4cc" opacity="0.4"/>
                          <circle cx="130" cy="45" r="2" fill="#5dd4cc" opacity="0.5"/>
                          <circle cx="140" cy="50" r="2" fill="#5dd4cc" opacity="0.4"/>
                        </svg>
                      </div>
                    </div>
                    <div class="empty-text">暂无数据</div>
                  </div>

                  <div v-else>
                    <div v-for="item in invitationList" :key="item.id" class="invitation-item">
                      <div class="user-avatar">👤</div>
                      <div class="user-info">
                        <div class="user-name">{{ item.wxName }}</div>
                        <div class="user-status">{{ item.statusDesc }}</div>
                        <div class="user-time">{{ item.addTime }}</div>
                      </div>
                    </div>
                  </div>

                  <div v-if="loading" class="loading-state">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                  </div>
                </div>

                <!-- 营期看板 -->
                <div v-if="currentTab === 'board'" class="empty-state">
                  <div class="empty-icon">📊</div>
                  <div class="empty-text">功能开发中...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    });

    app.mount('#app');
  </script>
</body>
</html>
