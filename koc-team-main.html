<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队管理 - 生财官网</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #cef4f0 0%, #e0f8f5 100%);
    }

    /* 顶部导航栏 */
    .top-navbar {
      background: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left, .nav-right {
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-center {
      flex: 1;
      text-align: center;
    }

    .nav-title {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .nav-url {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 页面标题栏 */
    .title-bar {
      background: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-bar-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #333;
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .title-bar-text {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .title-bar-link {
      background: none;
      border: none;
      color: #5dd4cc;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
      font-weight: 500;
    }

    .title-bar-link:active {
      opacity: 0.7;
    }

    /* 页面内容 */
    .page-wrapper {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* 统计区域 */
    .stats-section {
      background: #fff;
      padding: 20px 16px;
      display: flex;
      gap: 0;
    }

    .stat-col {
      flex: 1;
      text-align: center;
      padding: 0 12px;
    }

    .stat-col:first-child {
      border-right: 1px solid #eee;
    }

    .stat-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 600;
      color: #333;
    }

    .info-icon {
      width: 14px;
      height: 14px;
      border: 1px solid #bbb;
      border-radius: 50%;
      font-size: 10px;
      line-height: 12px;
      text-align: center;
      color: #999;
      cursor: pointer;
    }

    /* 按钮区域 */
    .action-section {
      background: rgba(206, 244, 240, 0.6);
      padding: 12px 16px;
      display: flex;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      background: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 13px;
      color: #5dd4cc;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .action-btn:active {
      background: #f5f5f5;
    }

    .action-icon {
      font-size: 14px;
    }

    .action-info-icon {
      width: 12px;
      height: 12px;
      border: 1px solid #5dd4cc;
      border-radius: 50%;
      font-size: 9px;
      line-height: 10px;
      text-align: center;
      color: #5dd4cc;
      margin-left: 2px;
    }

    /* Tab 和筛选区域 */
    .tabs-filter-wrapper {
      background: #fff;
    }

    .tabs-section {
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      display: flex;
    }

    .tab {
      background: none;
      border: none;
      padding: 14px 16px;
      cursor: pointer;
      color: #999;
      font-size: 14px;
      position: relative;
      transition: color 0.3s ease;
      font-weight: 500;
    }

    .tab.active {
      color: #333;
      font-weight: 600;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 3px;
      background: #5dd4cc;
    }

    .filters-section {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .filter-btn {
      background: #f5f5f5;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .filter-btn.active {
      background: #5dd4cc;
      color: #fff;
    }

    .filter-btn:active {
      opacity: 0.8;
    }

    /* 内容区域 */
    .content-area {
      flex: 1;
      background: #f5f5f5;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 80px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .empty-text {
      font-size: 14px;
      color: #999;
      font-weight: 500;
    }

    /* 加载态 */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0f8f5;
      border-top-color: #5dd4cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-state p {
      font-size: 14px;
      color: #999;
    }

    /* 成员卡片 */
    .member-card {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .member-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .member-info {
      flex: 1;
    }

    .member-name {
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 2px;
    }

    .member-tag {
      display: inline-block;
      background: #e8f5f4;
      color: #5dd4cc;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .member-phone {
      font-size: 12px;
      color: #999;
    }

    .member-stats {
      display: flex;
      gap: 16px;
      text-align: center;
    }

    .stat {
      min-width: 45px;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 600;
      color: #5dd4cc;
    }

    .stat-name {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .member-details {
      background: #f9f9f9;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: #666;
    }

    .detail-label {
      color: #999;
    }

    .detail-value {
      color: #333;
      font-weight: 500;
    }

    .member-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .action-btn-sm {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #eee;
      background: #fff;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-btn-sm:active {
      background: #f5f5f5;
    }

    .action-btn-sm.primary {
      color: #5dd4cc;
      border-color: #e8f5f4;
    }

    .action-btn-sm.primary:active {
      background: #e8f5f4;
    }

    .action-btn-sm.danger {
      color: #ff6b6b;
      border-color: #ffcccc;
    }

    .action-btn-sm.danger:active {
      background: #fff0f0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const app = createApp({
      setup() {
        const currentTab = ref('progress');
        const filterStatus = ref('');
        const teamMembers = ref([]);
        const loading = ref(false);

        const teamStats = ref({
          totalMembers: 0,
          totalInviteCount: 0,
        });

        const filterItems = [
          { label: '全部', value: '' },
          { label: '邀请成功', value: 'success' },
          { label: '邀请中', value: 'inviting' },
          { label: '已删除', value: 'deleted' },
        ];

        const loadTeamMembers = () => {
          loading.value = true;
          setTimeout(() => {
            teamStats.value = {
              totalMembers: 2,
              totalInviteCount: 63,
            };

            teamMembers.value = [
              {
                distributorId: 1,
                distributorName: '张三',
                distributorPhone: '13812345678',
                inviteCode: 'KOC_M_001234',
                tag: '微信群1',
                joinTime: '2026-05-01 10:30:00',
                status: 'success',
                inviteCount: 28,
                convertCount: 10,
                tryCount: 20,
                chatCount: 8,
              },
              {
                distributorId: 2,
                distributorName: '李四',
                distributorPhone: '13912345679',
                inviteCode: 'KOC_M_001235',
                tag: '朋友圈',
                joinTime: '2026-05-02 14:20:00',
                status: 'success',
                inviteCount: 35,
                convertCount: 15,
                tryCount: 25,
                chatCount: 12,
              },
            ];

            loading.value = false;
          }, 500);
        };

        const filteredMembers = computed(() => {
          if (!filterStatus.value) {
            return teamMembers.value;
          }
          return teamMembers.value.filter(item => item.status === filterStatus.value);
        });

        const goToInviteRecord = () => {
          window.location.href = './koc-team-index.html';
        };

        const handleViewDetail = (member) => {
          alert(`查看详情: ${member.distributorName}\n邀请码: ${member.inviteCode}`);
        };

        const handleViewInviteCode = (member) => {
          alert(`邀请码: ${member.inviteCode}`);
        };

        const handleDeleteMember = (member) => {
          const confirmed = confirm(`确定删除下属？\n删除后，${member.distributorName} 的邀请码将失效，但已有的邀请记录将保留`);
          if (confirmed) {
            alert('删除成功');
            loadTeamMembers();
          }
        };

        onMounted(() => {
          loadTeamMembers();
        });

        return {
          currentTab,
          filterStatus,
          teamMembers: filteredMembers,
          loading,
          teamStats,
          filterItems,
          goToInviteRecord,
          handleViewDetail,
          handleViewInviteCode,
          handleDeleteMember,
        };
      },
      template: `
        <div id="app-container">
          <!-- 顶部导航栏 -->
          <div class="top-navbar">
            <div class="nav-left">
              <button class="nav-btn">×</button>
            </div>
            <div class="nav-center">
              <div class="nav-title">生财官网·会员体验卡</div>
              <div class="nav-url">scys.com</div>
            </div>
            <div class="nav-right">
              <button class="nav-btn">⋯</button>
            </div>
          </div>

          <!-- 页面标题栏 -->
          <div class="title-bar">
            <div class="title-bar-left">
              <button class="title-bar-btn">‹</button>
              <div class="title-bar-text">团队管理</div>
            </div>
            <button class="title-bar-link" @click="goToInviteRecord">邀请记录 ></button>
          </div>

          <div class="page-wrapper">
            <!-- 统计区域 -->
            <div class="stats-section">
              <div class="stat-col">
                <div class="stat-label">
                  总下属数
                  <span class="info-icon">ⓘ</span>
                </div>
                <div class="stat-value">{{ teamStats.totalMembers }}</div>
              </div>
              <div class="stat-col">
                <div class="stat-label">
                  总邀请数
                  <span class="info-icon">ⓘ</span>
                </div>
                <div class="stat-value">{{ teamStats.totalInviteCount }}</div>
              </div>
            </div>

            <!-- 按钮区域 -->
            <div class="action-section">
              <button class="action-btn">
                <span class="action-icon">🔗</span>
                <span>生成邀请码</span>
                <span class="action-info-icon">ⓘ</span>
              </button>
              <button class="action-btn">
                <span class="action-icon">➕</span>
                <span>添加下属</span>
              </button>
            </div>

            <!-- Tab 和筛选区域 -->
            <div class="tabs-filter-wrapper">
              <div class="tabs-section">
                <button
                  class="tab"
                  :class="{ active: currentTab === 'progress' }"
                  @click="currentTab = 'progress'"
                >
                  团队进度
                </button>
                <button
                  class="tab"
                  :class="{ active: currentTab === 'board' }"
                  @click="currentTab = 'board'"
                >
                  管理看板
                </button>
              </div>

              <div class="filters-section">
                <button
                  v-for="item in filterItems"
                  :key="item.value"
                  class="filter-btn"
                  :class="{ active: filterStatus === item.value }"
                  @click="filterStatus = item.value"
                >
                  {{ item.label }}
                </button>
              </div>
            </div>

            <!-- 内容区域 -->
            <div class="content-area">
              <div class="list-container">
                <!-- 团队进度 -->
                <div v-if="currentTab === 'progress'">
                  <div v-if="teamMembers.length === 0 && !loading" class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">暂无数据</div>
                  </div>

                  <div v-else>
                    <div v-for="member in teamMembers" :key="member.distributorId" class="member-card">
                      <div class="member-header">
                        <div class="member-info">
                          <div class="member-name">{{ member.distributorName }}</div>
                          <div class="member-tag">{{ member.tag }}</div>
                          <div class="member-phone">{{ member.distributorPhone }}</div>
                        </div>
                        <div class="member-stats">
                          <div class="stat">
                            <div class="stat-num">{{ member.inviteCount }}</div>
                            <div class="stat-name">邀请</div>
                          </div>
                          <div class="stat">
                            <div class="stat-num">{{ member.convertCount }}</div>
                            <div class="stat-name">转化</div>
                          </div>
                        </div>
                      </div>

                      <div class="member-details">
                        <div class="detail-item">
                          <span class="detail-label">已领卡：</span>
                          <span class="detail-value">{{ member.tryCount }}</span>
                        </div>
                        <div class="detail-item">
                          <span class="detail-label">已入营：</span>
                          <span class="detail-value">{{ member.chatCount }}</span>
                        </div>
                        <div class="detail-item">
                          <span class="detail-label">加入时间：</span>
                          <span class="detail-value">{{ member.joinTime }}</span>
                        </div>
                      </div>

                      <div class="member-actions">
                        <button class="action-btn-sm primary" @click="handleViewInviteCode(member)">查看邀请码</button>
                        <button class="action-btn-sm primary" @click="handleViewDetail(member)">查看详情</button>
                        <button class="action-btn-sm danger" @click="handleDeleteMember(member)">删除</button>
                      </div>
                    </div>
                  </div>

                  <div v-if="loading" class="loading-state">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                  </div>
                </div>

                <!-- 管理看板 -->
                <div v-if="currentTab === 'board'" class="empty-state">
                  <div class="empty-icon">📊</div>
                  <div class="empty-text">功能开发中...</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    });

    app.mount('#app');
  </script>
</body>
</html>
